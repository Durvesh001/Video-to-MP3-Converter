name: video-to-mp3

x-worker-environment: &worker-environment
  PYTHONUNBUFFERED: "1"
  RABBITMQ_URL: amqp://converter:local-rabbit-password@rabbitmq:5672/%2F
  VIDEO_QUEUE: video
  MP3_QUEUE: mp3

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: auth
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: local-auth-password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./python/src/auth/init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'mysql -h 127.0.0.1 -u auth_user -p"$$MYSQL_PASSWORD" auth -e "SELECT 1 FROM user LIMIT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: converter
      RABBITMQ_DEFAULT_PASS: local-rabbit-password
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD-SHELL, "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  auth:
    build: ./python/src/auth
    environment:
      PYTHONUNBUFFERED: "1"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: local-auth-password
      MYSQL_DB: auth
      JWT_SECRET: local-demo-signing-key-change-for-any-deployment
      DEMO_USER_EMAIL: demo@example.com
      DEMO_USER_PASSWORD: demo-pass-123
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gateway:
    build: ./python/src/gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *worker-environment
      MONGO_URI: mongodb://mongo:27017
      AUTH_SVC_ADDRESS: auth:5000
    depends_on:
      auth:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  converter:
    build: ./python/src/converter
    environment:
      <<: *worker-environment
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification:
    build: ./python/src/notification
    environment:
      <<: *worker-environment
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_FROM: converter@example.com
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  mongo-data:
  rabbit-data:
